    <link rel="preload" as="image" href="%BASE_URL%assets/banners/hero-robot-480.webp" type="image/webp" />
    <script>
      // Apply saved theme + language before first paint (prevents flash).
      (function () {
        try {
          var t = localStorage.getItem('carbon-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var d = document.documentElement;
          d.dataset.theme = dark ? 'dark' : 'light';
          var l = localStorage.getItem('carbon-lang') || 'ar';
          d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Carbon Group Nutrition requires JavaScript. / يتطلب الموقع تفعيل جافاسكربت.</noscript>

  </body>
</html>
